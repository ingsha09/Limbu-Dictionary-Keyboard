name: Build Signed Release APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Ensure Compatible Gradle Wrapper Exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Extract Version Name from Gradle
        id: get_version
        run: |
          VERSION_NAME=$(./gradlew properties -q | grep "^versionName:" | awk '{print $2}')
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "null" ]; then
            VERSION_NAME="1.6"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign APK and AAB Native
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Decode keystore from secret
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

          # 2. Find build-tools path dynamically
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using build-tools from: $BUILD_TOOLS_DIR"

          # 3. Zipalign and sign APK
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-aligned.apk" | head -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_FILE" "${APK_FILE%.apk}-aligned.apk"
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/Limbu_Dictionary_Keyboard_v${{ env.VERSION_NAME }}.apk \
            "${APK_FILE%.apk}-aligned.apk"

          # 4. Sign AAB via jarsigner and rename
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" "$KEY_ALIAS"
          
          cp "$AAB_FILE" app/build/outputs/bundle/release/Limbu_Dictionary_Keyboard_v${{ env.VERSION_NAME }}.aab

          # Clean up local keystore artifact
          rm release.keystore

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Limbu-Dictionary-Keyboard-APK-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/Limbu_Dictionary_Keyboard_v${{ env.VERSION_NAME }}.apk

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Limbu-Dictionary-Keyboard-AAB-v${{ env.VERSION_NAME }}
          path: app/build/outputs/bundle/release/Limbu_Dictionary_Keyboard_v${{ env.VERSION_NAME }}.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION_NAME }}.${{ github.run_number }}
          name: Limbu Dictionary Keyboard v${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/Limbu_Dictionary_Keyboard_v${{ env.VERSION_NAME }}.apk
            app/build/outputs/bundle/release/Limbu_Dictionary_Keyboard_v${{ env.VERSION_NAME }}.aab
