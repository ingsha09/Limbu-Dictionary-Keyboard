name: Build Signed Release APK and AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Ensure Compatible Gradle Wrapper Exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign APK and AAB Native
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Decode keystore from secret
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

          # 2. Find build-tools path dynamically
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using build-tools from: $BUILD_TOOLS_DIR"

          # 3. Zipalign and sign APK
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-aligned.apk" | head -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_FILE" "${APK_FILE%.apk}-aligned.apk"
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            "${APK_FILE%.apk}-aligned.apk"

          # 4. Sign AAB via jarsigner
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" "$KEY_ALIAS"

          # Clean up local keystore artifact
          rm release.keystore

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
